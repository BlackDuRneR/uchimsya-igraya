name: Harmony — сборка APK

on:
  push:
    paths:
      - "yasnost/**"
      - ".github/workflows/yasnost-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yasnost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk Harmony.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Harmony.apk
          path: yasnost/Harmony.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yasnost-${{ github.run_number }}
          name: Harmony (сборка ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: yasnost/Harmony.apk
