<style>
/* ===== ДИЗАЙН-СИСТЕМА «Учимся играя» ===== */
:root{
 --ds-bg:#FFF8EC;--ds-card:#FFFFFF;--ds-ink:#292944;--ds-muted:#8B8AA3;--ds-line:#F0E8DA;
 --ds-coral:#FF8A65;--ds-blue:#5187F5;--ds-green:#43BD79;--ds-violet:#9874F5;--ds-yellow:#F6A321;--ds-teal:#20B4C2;
 --ds-r-sm:16px;--ds-r:24px;--ds-r-lg:30px;
 --ds-sh:0 2px 0 rgba(41,41,68,.04),0 8px 22px rgba(41,41,68,.08);--ds-sh-press:0 1px 0 rgba(41,41,68,.04),0 3px 10px rgba(41,41,68,.08);
 --ds-pad:14px;--ds-tap:48px;--ds-fast:.16s;--ds-ease:cubic-bezier(.2,.8,.3,1);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;min-height:100%}
#start{overflow-x:clip}
body{background:var(--ds-bg);color:var(--ds-ink);font-family:"Trebuchet MS","Arial Rounded MT Bold","Segoe UI",system-ui,Arial,sans-serif;font-weight:700}
button{font:inherit;color:inherit}
button:focus-visible{outline:4px solid color-mix(in srgb,var(--ds-blue) 60%,#fff);outline-offset:3px}
#start{max-width:1000px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom))}
/* шапка */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.owl{width:46px;height:46px;flex:none;filter:drop-shadow(0 3px 4px rgba(41,41,68,.15))}
.brand h1{font-size:clamp(21px,5.6vw,28px);margin:0;color:var(--ds-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;background:#fff;border-radius:999px;padding:4px;box-shadow:var(--ds-sh);border:none;cursor:pointer;flex:none}
.lang b{min-width:52px;min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:999px;font-size:16px;color:var(--ds-muted);transition:background var(--ds-fast),color var(--ds-fast)}
.lang b.on{background:var(--ds-violet);color:#fff}
/* приветствие и прогресс */
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--ds-card);border-radius:var(--ds-r-lg);padding:16px;box-shadow:var(--ds-sh);margin-bottom:20px;position:relative;overflow:hidden}
.hero>*{position:relative;z-index:1}
.who{width:72px;height:72px;border-radius:24px;border:none;background:color-mix(in srgb,var(--ds-yellow) 22%,#fff);font-size:44px;cursor:pointer;position:relative;box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--ds-yellow) 30%,transparent)}
.who::after{content:"⇄";position:absolute;right:-5px;bottom:-5px;width:26px;height:26px;border-radius:50%;background:var(--ds-violet);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:var(--ds-sh)}
.hcol{min-width:0}
.hi{font-size:20px;line-height:1.25}.hi small{display:block;font-size:14px;color:var(--ds-muted);margin-top:3px}
.hbar{height:12px;border-radius:99px;background:#F1ECF8;overflow:hidden;margin-top:10px}.hbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--ds-violet),var(--ds-green));transition:width .6s var(--ds-ease)}
.hstars{font-size:14px;color:var(--ds-muted);margin-top:6px}
/* карточки разделов */
h3.gh{font-size:14px;margin:0 4px 10px;color:var(--ds-muted);text-transform:uppercase;letter-spacing:.8px}
.ages{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.ages.two{grid-template-columns:repeat(2,1fr)}
.age{position:relative;border:none;border-radius:var(--ds-r);background:var(--ds-card);box-shadow:var(--ds-sh);cursor:pointer;text-align:left;padding:var(--ds-pad);
 display:grid;grid-template-columns:auto 1fr;grid-template-areas:"ic tx" "pr pr";gap:12px;align-items:center;min-height:var(--ds-tap);
 transition:transform var(--ds-fast) var(--ds-ease),box-shadow var(--ds-fast);animation:dsIn .35s var(--ds-ease) both}
.age:active{transform:scale(.97);box-shadow:var(--ds-sh-press)}
.ic{grid-area:ic;width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:38px;line-height:1;
 background:color-mix(in srgb,var(--c) 18%,#fff);box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--c) 24%,transparent)}
.tx{grid-area:tx;display:flex;flex-direction:column;min-width:0}
.ay{font-size:21px;line-height:1.15;color:var(--ds-ink)}.an{font-size:15px;color:var(--c);margin-top:2px;filter:brightness(.85)}.ad{font-size:13px;color:var(--ds-muted);font-weight:400;margin-top:3px;line-height:1.3}
.pr{grid-area:pr;display:flex;align-items:center;gap:8px}.pbar{flex:1;height:8px;border-radius:99px;background:#F1ECF8;overflow:hidden}.pbar i{display:block;height:100%;width:0;border-radius:99px;background:var(--c);transition:width .6s var(--ds-ease)}
.pnum{font-size:12px;color:var(--ds-muted);white-space:nowrap}
.badge{position:absolute;top:-9px;right:12px;background:var(--ds-yellow);color:#fff;font-size:12px;border-radius:99px;padding:3px 10px;box-shadow:var(--ds-sh);display:none;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge.on{display:block}
.ages .age:nth-child(2){animation-delay:.04s}.ages .age:nth-child(3){animation-delay:.08s}
/* «Родителям» — спокойный стиль для взрослых */
.age.par{grid-template-columns:auto 1fr auto;grid-template-areas:"ic tx arr";background:#F4F0FF;box-shadow:none;border:2px solid #E4DBFB}
.age.par .ic{background:#fff;box-shadow:none;width:52px;height:52px;font-size:28px;border-radius:16px}
.age.par .ay{font-size:18px;color:#5B43B8}.age.par .an{color:var(--ds-ink);font-size:14px;filter:none}.arr{grid-area:arr;font-size:32px;color:#9C8BE0;line-height:1}
.credit{text-align:center;color:var(--ds-muted);font-size:12px;font-weight:400;margin:22px 0 4px;line-height:1.4}
.knote{text-align:center;color:var(--ds-muted);font-size:13px;font-weight:400;margin:10px 0 0}
@keyframes dsIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* верхняя панель внутри раздела */
#bar{display:none;align-items:center;gap:10px;min-height:60px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--ds-card);box-shadow:0 2px 12px rgba(41,41,68,.07);position:sticky;top:0;z-index:5}
#bar button{white-space:nowrap;flex:none;border:none;border-radius:999px;min-height:44px;cursor:pointer}
#back{background:var(--ds-yellow);color:#fff;font-size:17px;padding:0 16px 0 12px;box-shadow:0 3px 0 #D88A10}
#back:active{transform:translateY(2px);box-shadow:0 1px 0 #D88A10}
#bar span#ttl{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.bs{font-size:15px;background:#FFF3DE;border-radius:999px;padding:8px 12px;white-space:nowrap}.bs:empty{display:none}
#bar .bsnd{background:#F1ECF8;font-size:20px;width:44px}
iframe{display:none;width:100%;height:calc(100vh - 60px);height:calc(100dvh - 60px - env(safe-area-inset-top));border:0;background:var(--ds-bg)}
body.inapp #start{display:none} body.inapp #bar{display:flex}
/* окна: отдых и профили */
.modal{display:none;position:fixed;inset:0;background:rgba(41,41,68,.45);z-index:50;align-items:flex-end;justify-content:center;padding:16px}
.rbox{background:#fff;border-radius:var(--ds-r-lg);padding:20px;max-width:480px;width:100%;text-align:center;box-shadow:var(--ds-sh);max-height:88dvh;overflow:auto;animation:dsUp .25s var(--ds-ease)}
@keyframes dsUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:600px){.modal{align-items:center}}
.rowl{font-size:64px} .rbox h2{margin:4px 0 12px;font-size:24px;color:var(--ds-violet)} .rbox p{font-size:17px;margin:6px 0 10px;font-weight:400}
.ract{background:#FFF3DE;border-radius:var(--ds-r-sm);padding:12px;font-size:16px;font-weight:400;line-height:1.45;text-align:left;margin-bottom:14px} .ract b{font-weight:700}
.rbox .btn{display:block;width:100%;border:none;border-radius:var(--ds-r-sm);font-size:18px;min-height:52px;margin-top:10px;cursor:pointer;background:var(--ds-green);color:#fff;box-shadow:0 4px 0 #2E9A5E}
.rbox .btn.sec2{background:#F1ECF8;color:var(--ds-ink);box-shadow:none;font-size:16px}
.plist{display:flex;flex-direction:column;gap:10px;text-align:left}
.prow{display:flex;align-items:center;gap:10px;border:3px solid #F1ECF8;border-radius:var(--ds-r-sm);padding:6px 6px 6px 10px;min-height:var(--ds-tap);cursor:pointer;background:#fff}
.prow.on{border-color:var(--ds-violet);background:#F7F3FF}.prow .pa{font-size:34px}.prow .pn{flex:1;font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis}.prow .pn small{display:block;font-size:13px;color:var(--ds-muted)}
.prow .pdel{border:none;background:#F7F4FD;border-radius:12px;font-size:17px;color:#8E83B5;min-width:44px;height:44px;cursor:pointer;padding:0 8px}
.pform{text-align:left;margin-top:4px}.pform input{width:100%;font:inherit;font-size:19px;padding:12px 14px;border-radius:var(--ds-r-sm);border:3px solid #EDE6FB;outline:none;user-select:text;-webkit-user-select:text;color:var(--ds-ink)}
.pform input:focus{border-color:var(--ds-violet)}
.plab{font-size:14px;color:var(--ds-muted);margin:12px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:none;border-radius:999px;min-height:44px;min-width:44px;padding:0 14px;background:#F1ECF8;cursor:pointer;font-size:15px}
.chip.av{font-size:26px;padding:0 8px}.chip.on{background:var(--ds-violet);color:#fff}
@media (max-width:760px){.ages{grid-template-columns:1fr}.ages.two{grid-template-columns:1fr 1fr}
 .ages.two .age{grid-template-columns:1fr;grid-template-areas:"ic" "tx" "pr"}.ages.two .ad{display:none}}
@media (max-width:360px){#start{padding-left:10px;padding-right:10px}.ic{width:54px;height:54px;font-size:32px}.ay{font-size:18px}.hero{padding:12px;gap:10px}.who{width:58px;height:58px;font-size:34px}
 .hi{font-size:17px}.lang b{min-width:44px;font-size:14px}.owl{width:38px;height:38px}.brand h1{font-size:19px}#back{font-size:15px;padding:0 12px 0 10px}#bar span#ttl{font-size:15px}}
@media (min-width:900px){.age .ic{width:72px;height:72px;font-size:42px}.ay{font-size:23px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
/* узкие телефоны: компактная панель, название раздела целиком */
@media (max-width:374px){#bar{gap:6px;padding-left:8px;padding-right:8px;min-height:54px}
 #back{font-size:0!important;padding:0!important;width:48px;display:flex;align-items:center;justify-content:center}#back::before{content:"‹";font-size:30px;line-height:1}
 #bar span#ttl{font-size:clamp(14px,4.6vw,16px)}.bs{padding:7px 9px;font-size:14px}}

</style></head>

.tile:active{transform:scale(.95)}
.tile .e{font-size:96px;line-height:1.05;display:block}
.tile .t{font-size:26px;display:block;margin-top:6px}
/* общие */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{border:none;border-radius:32px;background:#FFF5E1;cursor:pointer;font:inherit;color:var(--ink);padding:10px 6px 12px;box-shadow:0 7px 0 #F2DDB2;position:relative;overflow:hidden}
.card .em{font-size:110px;line-height:1.15;display:block}
.card .nm{font-size:26px;display:block}
.card:active{transform:scale(.94)}
.jump{animation:jump .6s}
@keyframes jump{0%{transform:scale(1)}30%{transform:scale(1.18) rotate(-6deg)}60%{transform:scale(.95) rotate(4deg)}100%{transform:scale(1)}}
.label{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.5);background:#fff;border:5px solid var(--sun);border-radius:30px;padding:10px 30px;font-size:52px;opacity:0;pointer-events:none;transition:.25s;z-index:5;white-space:nowrap;box-shadow:0 8px 0 rgba(0,0,0,.1)}
.label.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
h2{text-align:center;font-size:36px;margin:0 0 12px}
svg .part{cursor:pointer;transition:filter .2s,transform .3s;transform-box:fill-box;transform-origin:center}
svg .part.lit{filter:drop-shadow(0 0 14px #FFD400) drop-shadow(0 0 6px #FFB000);transform:scale(1.08)}
.svgbox{display:flex;justify-content:center}
.svgbox svg{width:min(560px,92vw);height:auto;max-height:72vh}
/* день-ночь */
.scene{position:relative;height:70vh;min-height:420px;border-radius:26px;overflow:hidden;cursor:pointer;transition:background 1.2s}
.scene .sun,.scene .moon{position:absolute;font-size:140px;transition:all 1.4s ease-in-out;line-height:1}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:28%;background:#6CCB5F;transition:background 1.2s}
.scene .house{position:absolute;bottom:20%;left:12%;font-size:170px;line-height:1}
.scene .tree{position:absolute;bottom:22%;right:12%;font-size:150px;line-height:1}
.scene .who{position:absolute;bottom:6%;left:46%;font-size:110px;line-height:1;transition:all .6s}
.scene .star{position:absolute;font-size:44px;transition:opacity 1s}
.scene .cap{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.85);border-radius:22px;padding:6px 26px;font-size:40px}
.phases{display:flex;justify-content:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.phases button{border:none;border-radius:24px;font-size:56px;padding:6px 18px;background:#F3F0FF;cursor:pointer}
.phases button.on{background:var(--sun)}
/* пузыри */
.pond{position:relative;height:72vh;min-height:420px;border-radius:26px;background:linear-gradient(#CDEFFF,#F2FBFF);overflow:hidden}
.bub{position:absolute;border-radius:50%;cursor:pointer;box-shadow:inset -12px -12px 0 rgba(0,0,0,.08),inset 10px 10px 0 rgba(255,255,255,.5)}
.bub.pop{animation:bpop .28s forwards}
@keyframes bpop{to{transform:scale(1.7);opacity:0}}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(calc(-72vh - 260px))}}
/* ксилофон */
.xylo{display:flex;gap:10px;height:66vh;min-height:380px;align-items:center;justify-content:center}
.key{flex:1;max-width:130px;border:none;border-radius:24px;cursor:pointer;font-size:54px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;box-shadow:0 8px 0 rgba(0,0,0,.18);transition:transform .08s}
.key:active,.key.hit{transform:translateY(6px) scale(.97);box-shadow:0 2px 0 rgba(0,0,0,.18)}
/* ку-ку */
.hide{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.box{height:clamp(160px,28vh,240px);border:none;border-radius:32px;cursor:pointer;font-size:120px;position:relative;background:#E6F7E2;box-shadow:0 7px 0 #BFE5B5;overflow:hidden}
.box .an{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:translateY(100%);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.box .co{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:transform .35s}
.box.open .an{transform:translateY(0)} .box.open .co{transform:translateY(-110%)}
/* покажи где */
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:820px;margin:0 auto}
.two .card .em{font-size:clamp(130px,22vw,210px)}
.ask{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:14px;font-size:44px}
.ask button{border:none;background:var(--sun);border-radius:50%;width:80px;height:80px;font-size:40px;cursor:pointer;box-shadow:0 6px 0 #D29B00}
/* рисовалка */
.paintwrap{display:flex;flex-direction:column;gap:10px;height:74vh;min-height:420px}
canvas#paint{flex:1;width:100%;border-radius:24px;background:#fff;border:5px dashed #F0E2C3;touch-action:none;cursor:crosshair}
.pal{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pal button{width:70px;height:70px;border-radius:50%;border:5px solid #fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.pal button.on{border-color:var(--ink);transform:scale(1.12)}
/* семья */
.photo{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:24px;display:block}
.cam{position:absolute;top:8px;right:8px;width:46px;height:46px;border-radius:50%;border:none;background:#fff;font-size:24px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.hint{text-align:center;color:var(--muted);font-size:18px;margin:12px 0 0;font-weight:400}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:30}

/* ===== ДИЗАЙН-СИСТЕМА «Учимся играя» ===== */
:root{
 --ds-bg:#FFF8EC;--ds-card:#FFFFFF;--ds-ink:#292944;--ds-muted:#8B8AA3;--ds-line:#F0E8DA;
 --ds-coral:#FF8A65;--ds-blue:#5187F5;--ds-green:#43BD79;--ds-violet:#9874F5;--ds-yellow:#F6A321;--ds-teal:#20B4C2;
 --ds-r-sm:16px;--ds-r:24px;--ds-r-lg:30px;
 --ds-sh:0 2px 0 rgba(41,41,68,.04),0 8px 22px rgba(41,41,68,.08);--ds-sh-press:0 1px 0 rgba(41,41,68,.04),0 3px 10px rgba(41,41,68,.08);
 --ds-pad:14px;--ds-tap:48px;--ds-fast:.16s;--ds-ease:cubic-bezier(.2,.8,.3,1);
}
/* ===== навигация и единый стиль разделов ===== */
:root{--bg:var(--ds-bg);--ink:var(--ds-ink);--muted:var(--ds-muted)}
html.emb body{background:var(--ds-bg)!important;background-image:none!important;color:var(--ds-ink)}
html.emb header{display:none!important}
html.emb .credit,html.emb p.voice[style*=&quot;font-weight:700&quot;]{display:none!important}
html.emb .note,html.emb p.voice{font-size:12px!important;margin:8px 0 0!important}
html.emb .wrap{padding-top:10px}
html.emb main,html.emb .panel{min-height:auto;background:transparent!important;box-shadow:none!important;padding:4px!important}
html,body{overflow-x:clip;max-width:100%}
/* категории */
.ncats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.ncat{position:relative;border:none;border-radius:var(--ds-r);background:var(--ds-card);color:var(--ds-ink);font:inherit;cursor:pointer;padding:16px 12px 14px;
 display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:var(--ds-sh);min-height:168px;justify-content:flex-start;
 transition:transform var(--ds-fast) var(--ds-ease),box-shadow var(--ds-fast)}
.ncat:active,.tile.nt:active{transform:scale(.96);box-shadow:var(--ds-sh-press)}
.ncat .ne,.tile.nt .e{width:76px;height:76px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:44px!important;line-height:1;
 background:color-mix(in srgb,var(--c,#9874F5) 18%,#fff);box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--c,#9874F5) 22%,transparent)}
.ncat .nn{font-size:18px;margin-top:10px;line-height:1.2}
.ncat .nc{font-size:13px;color:var(--ds-muted);margin-top:6px;font-weight:700}
.ncat .np,.tile.nt .np{width:72%;height:7px;border-radius:99px;background:#F1ECF8;margin-top:8px;overflow:hidden}
.ncat .np i,.tile.nt .np i{display:block;height:100%;border-radius:99px;background:var(--c,#9874F5)}
h2.nh{text-align:center;font-size:26px;margin:4px 0 14px;color:var(--ds-ink)}
/* карточки игр */
.menu .tile.nt{background:var(--ds-card)!important;background-image:none!important;color:var(--ds-ink)!important;box-shadow:var(--ds-sh)!important;border-radius:var(--ds-r)!important;
 padding:14px 8px 12px!important;display:flex;flex-direction:column;align-items:center;position:relative;transition:transform var(--ds-fast) var(--ds-ease),box-shadow var(--ds-fast)}
.menu .tile.nt .t{color:var(--ds-ink)!important;font-size:16px!important;line-height:1.2;margin-top:10px!important}
.menu .tile.nt .done{position:absolute;top:8px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--ds-green);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center}
.menu{gap:14px!important}
/* появление */
@keyframes dsIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ncat,.menu .tile.nt{animation:dsIn .32s var(--ds-ease) both}
.ncat:nth-child(2),.menu .tile:nth-child(2){animation-delay:.03s}.ncat:nth-child(3),.menu .tile:nth-child(3){animation-delay:.06s}.ncat:nth-child(4),.menu .tile:nth-child(4){animation-delay:.09s}
.ncat:nth-child(5),.menu .tile:nth-child(5){animation-delay:.12s}.ncat:nth-child(n+6),.menu .tile:nth-child(n+6){animation-delay:.15s}
/* кнопки и ответы — общий вид */
.big-btn{border-radius:var(--ds-r-sm)!important}
.opt,.wo,.ch,.wbtn,.card,.pic,.clap,.box,.mc,.dot,.kcell,.wcard{transition:transform var(--ds-fast) var(--ds-ease)}
.opt:active,.wo:active,.ch:active,.wbtn:active,.card:active,.pic:active,.clap:active{transform:scale(.95)}
.opt,.wo,.ch,.wbtn,.card,.pic,.clap{border-radius:var(--ds-r)!important}
.opt.ok,.wo.ok,.ch.ok,.wbtn.ok{animation:dsPop .4s var(--ds-ease)}
@keyframes dsPop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
button:focus-visible{outline:4px solid color-mix(in srgb,var(--ds-blue) 60%,#fff);outline-offset:3px}
h2{color:var(--ds-ink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

&lt;title&gt;Почемучки&lt;/title&gt;
&lt;style&gt;
:root{--bg:#F2FBF4;--ink:#33304F;--muted:#8A86A3;--sun:#FFC83D;--green:#43C26B;--pink:#FF6FA0;--blue:#4F8BFF;--violet:#9C7BFF;--orange:#FF9A4D;--teal:#22B8C8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:&quot;Trebuchet MS&quot;,&quot;Arial Rounded MT Bold&quot;,&quot;Segoe UI&quot;,system-ui,Arial,sans-serif;font-weight:700;touch-action:manipulation;
 background-image:radial-gradient(circle at 5% 12%,#CFF2D9 0 80px,transparent 81px),radial-gradient(circle at 96% 20%,#FFE6B3 0 70px,transparent 71px),radial-gradient(circle at 88% 95%,#DCE7FF 0 120px,transparent 121px);background-attachment:fixed}
.wrap{max-width:1200px;margin:0 auto;padding:12px 14px 18px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.logo{font-size:30px;color:var(--green);display:flex;align-items:center;gap:8px}.logo span{font-size:42px}
.hb{display:flex;gap:10px;align-items:center}
.pill{background:#fff;border-radius:999px;padding:8px 16px;font-size:26px;box-shadow:0 5px 0 rgba(0,0,0,.08)}
.rb{width:62px;height:62px;border-radius:50%;border:none;background:#fff;font-size:30px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.08)}
main{background:#fff;border-radius:34px;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.06);position:relative;overflow:hidden;min-height:72vh}
.voice{text-align:center;font-size:15px;color:var(--muted);margin:8px 0 0;font-weight:400}
.sec{font-size:28px;margin:18px 4px 10px}.sec:first-child{margin-top:2px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tile{border:none;border-radius:30px;padding:14px 8px 12px;cursor:pointer;color:#fff;font:inherit;box-shadow:0 8px 0 rgba(0,0,0,.14)}
.tile:active{transform:scale(.95)}
.tile .e{font-size:78px;line-height:1.1;display:block}.tile .t{font-size:23px;display:block;margin-top:4px}
h2{text-align:center;font-size:38px;margin:4px 0 14px}
.ask{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:14px;font-size:40px;text-align:center;flex-wrap:wrap}
.ask button{border:none;background:var(--sun);border-radius:50%;width:76px;height:76px;font-size:38px;cursor:pointer;box-shadow:0 6px 0 #D29B00;flex:none}
.opts{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
.opt{min-width:clamp(140px,22vw,230px);min-height:clamp(140px,22vw,230px);border:none;border-radius:34px;background:#FFF6E3;cursor:pointer;font:inherit;font-size:clamp(90px,14vw,150px);line-height:1;box-shadow:0 8px 0 #EEDDB5;display:flex;align-items:center;justify-content:center;padding:10px;color:var(--ink)}
.opt.ok{background:#D9F7E3;box-shadow:0 8px 0 var(--green)}
.opt.no{opacity:.35}
.stars{text-align:center;font-size:38px;min-height:46px;margin-top:14px;letter-spacing:4px}
.jump{animation:jump .6s}
@keyframes jump{0%{transform:scale(1)}30%{transform:scale(1.15) rotate(-5deg)}60%{transform:scale(.96) rotate(3deg)}100%{transform:scale(1)}}
.shake{animation:shake .35s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.dot{width:clamp(120px,18vw,180px);height:clamp(120px,18vw,180px);border-radius:50%;border:none;cursor:pointer;box-shadow:inset -14px -14px 0 rgba(0,0,0,.1),0 8px 0 rgba(0,0,0,.12)}
/* перетаскивание */
.drag{cursor:grab;touch-action:none}
.ghost{position:fixed;pointer-events:none;z-index:50;transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 10px 10px rgba(0,0,0,.25))}
.tray{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;min-height:130px;margin:10px 0 20px}
.item{font-size:90px;line-height:1;background:#FFF6E3;border-radius:26px;padding:10px;box-shadow:0 6px 0 #EEDDB5}
.bowls{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.bowl{width:clamp(170px,26vw,260px);min-height:180px;border-radius:30px 30px 90px 90px;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;padding:10px;font-size:46px;gap:4px;border:8px solid rgba(0,0,0,.08)}
.board{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;background:#F5E6CF;border-radius:34px;padding:26px;margin-bottom:20px}
.hole{width:150px;height:150px;display:flex;align-items:center;justify-content:center}
/* счёт */
.count{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin:0 0 18px}
.count .c{font-size:100px;line-height:1;cursor:pointer;position:relative}
.count .c i{position:absolute;top:-6px;right:-6px;background:var(--blue);color:#fff;font-style:normal;font-size:30px;border-radius:50%;width:46px;height:46px;display:flex;align-items:center;justify-content:center}
.num{font-size:clamp(90px,14vw,140px)!important;color:var(--blue)}
/* память */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:760px;margin:0 auto}
.mc{aspect-ratio:1/1;border:none;border-radius:26px;cursor:pointer;font-size:clamp(60px,10vw,100px);background:linear-gradient(135deg,#9C7BFF,#4F8BFF);color:transparent;box-shadow:0 7px 0 #5B44C9;transition:transform .3s}
.mc.open,.mc.done{background:#FFF6E3;color:inherit;box-shadow:0 7px 0 #EEDDB5;transform:rotateY(180deg)}
.mc span{display:inline-block;transform:rotateY(180deg)}
.mc.done{opacity:.55}
/* пазл */
.pz{display:grid;grid-template-columns:repeat(2,var(--ps));grid-template-rows:repeat(2,var(--ps));gap:6px;justify-content:center;margin:0 auto 18px;--ps:min(170px,36vw)}
.slot{background:#EDE7DA;border-radius:16px;border:4px dashed #D4C7AE;overflow:hidden;position:relative}
.piece{width:var(--ps);height:var(--ps);overflow:hidden;position:relative;border-radius:16px;background:#FFF6E3;box-shadow:0 5px 0 #EEDDB5}
.piece span,.slot span{position:absolute;width:calc(var(--ps)*2);height:calc(var(--ps)*2);font-size:calc(var(--ps)*1.6);line-height:calc(var(--ps)*2);text-align:center}
.ptray{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;--ps:min(150px,22vw)}
.ptray .piece span{width:calc(var(--ps)*2);height:calc(var(--ps)*2);font-size:calc(var(--ps)*1.6);line-height:calc(var(--ps)*2)}
/* буквы */
.lt{font-size:clamp(110px,16vw,170px)!important;color:#F0435A}
.lt.c{color:#2F6FE4}
.weather{font-size:150px;text-align:center;line-height:1.1}
.shadow{filter:brightness(0) opacity(.75)}
.die{width:clamp(170px,26vw,230px);aspect-ratio:1/1;background:#fff;border:8px solid #33304F;border-radius:36px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:18px;margin:0 auto 20px;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.die i{width:70%;height:70%;margin:auto;border-radius:50%;background:#E8505B}
.row3{display:flex;justify-content:center;align-items:flex-end;gap:16px;min-height:200px;margin:10px 0 20px;flex-wrap:wrap}
.kshow{text-align:center;font-size:clamp(70px,14vw,120px);line-height:1.15;margin:0 0 14px}
.ke{font-size:clamp(70px,14vw,110px);line-height:1.1;display:block}.kt{font-size:20px;display:block}
.kopt{flex-direction:column}
.kgrp{font-size:clamp(30px,7vw,46px);line-height:1.25;max-width:200px;display:block;word-break:break-all}
.kn{font-size:clamp(64px,14vw,100px);color:#3B7BFF}
.krow{font-size:clamp(40px,10vw,64px);letter-spacing:4px;line-height:1.3}.kq{color:#FFC83D;font-weight:900}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto}
.kcell{aspect-ratio:1/1;border:none;border-radius:20px;background:#FFF6E3;box-shadow:0 5px 0 #EEDDB5;cursor:pointer;display:flex;align-items:center;justify-content:center}
.kcell svg{width:70%;height:70%}.kcell.ok{background:#D9F7E3;box-shadow:0 5px 0 #43C26B}
.kcups{display:flex;justify-content:center;gap:16px;margin:30px 0}
.kcup{position:relative;width:clamp(90px,26vw,140px);height:clamp(130px,36vw,190px);border:none;background:none;cursor:pointer}
.kcup .toy{position:absolute;bottom:0;left:0;right:0;font-size:clamp(50px,12vw,80px);text-align:center}
.kcup .cap{position:absolute;bottom:0;left:0;right:0;font-size:clamp(90px,24vw,140px);transform:translateY(-110%);transition:transform .45s;text-align:center;line-height:1}
.kcup.down .cap{transform:translateY(0)}
.kcup.swapL{transform:translateX(calc(100% + 16px));transition:transform .8s}.kcup.swapR{transform:translateX(calc(-100% - 16px));transition:transform .8s}
.kpads{display:flex;justify-content:center;gap:14px;margin:20px 0}
.kpad{width:clamp(96px,27vw,160px);height:clamp(96px,27vw,160px);border-radius:50%;border:none;font-size:clamp(50px,13vw,80px);cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.18);transition:transform .1s,filter .1s}
.kpad.on{transform:scale(1.12);filter:brightness(1.25)}
.kpair{font-size:clamp(56px,13vw,90px);line-height:1;display:flex;flex-direction:column;align-items:center}.kpair small{font-size:.7em}
.kmix{display:flex;flex-direction:column;align-items:center;margin:10px 0}
.khalf{border:none;background:#FFF6E3;width:min(260px,70vw);height:min(130px,35vw);overflow:hidden;position:relative;cursor:pointer}
.khalf span{position:absolute;left:0;right:0;font-size:min(250px,66vw);line-height:min(260px,70vw);text-align:center}
.khalf.top{border-radius:30px 30px 0 0;border-bottom:3px dashed #E9DFC9}.khalf.top span{top:0}.khalf.bot{border-radius:0 0 30px 30px}.khalf.bot span{bottom:0}
.say{font-size:22px}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:60}
.label{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.5);background:#fff;border:5px solid var(--sun);border-radius:30px;padding:10px 30px;font-size:50px;opacity:0;pointer-events:none;transition:.25s;z-index:55;white-space:nowrap}
.label.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (max-width:640px){.logo{font-size:22px}.logo span{font-size:32px}.rb{width:50px;height:50px;font-size:24px}.pill{font-size:20px;padding:6px 10px}.hb{gap:6px}.menu{grid-template-columns:1fr 1fr}.tile .e{font-size:64px}.tile .t{font-size:20px}h2,.ask{font-size:30px}.mem{grid-template-columns:repeat(3,1fr)}}
/* ===== ДИЗАЙН-СИСТЕМА «Учимся играя» ===== */
:root{
 --ds-bg:#FFF8EC;--ds-card:#FFFFFF;--ds-ink:#292944;--ds-muted:#8B8AA3;--ds-line:#F0E8DA;
 --ds-coral:#FF8A65;--ds-blue:#5187F5;--ds-green:#43BD79;--ds-violet:#9874F5;--ds-yellow:#F6A321;--ds-teal:#20B4C2;
 --ds-r-sm:16px;--ds-r:24px;--ds-r-lg:30px;
 --ds-sh:0 2px 0 rgba(41,41,68,.04),0 8px 22px rgba(41,41,68,.08);--ds-sh-press:0 1px 0 rgba(41,41,68,.04),0 3px 10px rgba(41,41,68,.08);
 --ds-pad:14px;--ds-tap:48px;--ds-fast:.16s;--ds-ease:cubic-bezier(.2,.8,.3,1);
}
/* ===== навигация и единый стиль разделов ===== */
:root{--bg:var(--ds-bg);--ink:var(--ds-ink);--muted:var(--ds-muted)}
html.emb body{background:var(--ds-bg)!important;background-image:none!important;color:var(--ds-ink)}
html.emb header{display:none!important}
html.emb .credit,html.emb p.voice[style*=&quot;font-weight:700&quot;]{display:none!important}
html.emb .note,html.emb p.voice{font-size:12px!important;margin:8px 0 0!important}
html.emb .wrap{padding-top:10px}
html.emb main,html.emb .panel{min-height:auto;background:transparent!important;box-shadow:none!important;padding:4px!important}
html,body{overflow-x:clip;max-width:100%}
/* категории */
.ncats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.ncat{position:relative;border:none;border-radius:var(--ds-r);background:var(--ds-card);color:var(--ds-ink);font:inherit;cursor:pointer;padding:16px 12px 14px;
 display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:var(--ds-sh);min-height:168px;justify-content:flex-start;
 transition:transform var(--ds-fast) var(--ds-ease),box-shadow var(--ds-fast)}
.ncat:active,.tile.nt:active{transform:scale(.96);box-shadow:var(--ds-sh-press)}
.ncat .ne,.tile.nt .e{width:76px;height:76px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:44px!important;line-height:1;
 background:color-mix(in srgb,var(--c,#9874F5) 18%,#fff);box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--c,#9874F5) 22%,transparent)}
.ncat .nn{font-size:18px;margin-top:10px;line-height:1.2}
.ncat .nc{font-size:13px;color:var(--ds-muted);margin-top:6px;font-weight:700}
.ncat .np,.tile.nt .np{width:72%;height:7px;border-radius:99px;background:#F1ECF8;margin-top:8px;overflow:hidden}
.ncat .np i,.tile.nt .np i{display:block;height:100%;border-radius:99px;background:var(--c,#9874F5)}
h2.nh{text-align:center;font-size:26px;margin:4px 0 14px;color:var(--ds-ink)}
/* карточки игр */
.menu .tile.nt{background:var(--ds-card)!important;background-image:none!important;color:var(--ds-ink)!important;box-shadow:var(--ds-sh)!important;border-radius:var(--ds-r)!important;
 padding:14px 8px 12px!important;display:flex;flex-direction:column;align-items:center;position:relative;transition:transform var(--ds-fast) var(--ds-ease),box-shadow var(--ds-fast)}
.menu .tile.nt .t{color:var(--ds-ink)!important;font-size:16px!important;line-height:1.2;margin-top:10px!important}
.menu .tile.nt .done{position:absolute;top:8px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--ds-green);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center}
.menu{gap:14px!important}
/* появление */
@keyframes dsIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ncat,.menu .tile.nt{animation:dsIn .32s var(--ds-ease) both}
.ncat:nth-child(2),.menu .tile:nth-child(2){animation-delay:.03s}.ncat:nth-child(3),.menu .tile:nth-child(3){animation-delay:.06s}.ncat:nth-child(4),.menu .tile:nth-child(4){animation-delay:.09s}
.ncat:nth-child(5),.menu .tile:nth-child(5){animation-delay:.12s}.ncat:nth-child(n+6),.menu .tile:nth-child(n+6){animation-delay:.15s}
/* кнопки и ответы — общий вид */
.big-btn{border-radius:var(--ds-r-sm)!important}
.opt,.wo,.ch,.wbtn,.card,.pic,.clap,.box,.mc,.dot,.kcell,.wcard{transition:transform var(--ds-fast) var(--ds-ease)}
.opt:active,.wo:active,.ch:active,.wbtn:active,.card:active,.pic:active,.clap:active{transform:scale(.95)}
.opt,.wo,.ch,.wbtn,.card,.pic,.clap{border-radius:var(--ds-r)!important}
.opt.ok,.wo.ok,.ch.ok,.wbtn.ok{animation:dsPop .4s var(--ds-ease)}
@keyframes dsPop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
button:focus-visible{outline:4px solid color-mix(in srgb,var(--ds-blue) 60%,#fff);outline-offset:3px}
h2{color:var(--ds-ink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
/* телефон */
@media (max-width:640px){
 .wrap{padding:8px 8px 14px!important}
 .menu{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important}
 .ncats{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .ncat{min-height:156px;padding:14px 8px 12px}.ncat .ne,.tile.nt .e{width:66px;height:66px;font-size:38px!important;border-radius:20px}.ncat .nn{font-size:16px}
 h2{font-size:23px!important;line-height:1.25}
 .navrow .big-btn,.big-btn{font-size:20px!important;padding:12px 18px!important}
 .say{font-size:20px!important}
 .key{min-width:0!important;font-size:30px!important;padding-bottom:10px!important}.xylo{gap:5px!important}
 .cnt{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:8px 6px!important}.cnt span{font-size:clamp(36px,11vw,84px)!important}
 .wseq{gap:6px!important}.wseq span{min-width:0!important;flex:1;font-size:clamp(34px,10vw,72px)!important;padding:4px 2px!important;text-align:center}
 .card .en{font-size:clamp(18px,5.4vw,30px)!important;overflow-wrap:anywhere}.card .em{font-size:clamp(64px,18vw,92px)!important}
 .choices{gap:10px!important}.ch{width:clamp(96px,28vw,200px)!important;height:clamp(110px,32vw,230px)!important;font-size:clamp(64px,18vw,160px)!important}
 .wo{min-width:calc(50% - 12px)!important}.wops.nums .wo,.wops .wo:has(.wn){min-width:calc(33% - 12px)!important}
 .grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))!important}.lt{font-size:46px!important}
 .huge{font-size:clamp(120px,40vw,200px)!important;padding:6px 26px 16px!important}
 .readword,.enw{font-size:clamp(48px,14vw,110px)!important}.wbtn{font-size:clamp(40px,12vw,90px)!important;min-width:86%!important}
 .mletter{font-size:clamp(90px,26vw,220px)!important;padding:6px 14px 16px!important}
 .roof{border-left-width:min(160px,38vw)!important;border-right-width:min(160px,38vw)!important}
 .wbin{min-width:calc(50% - 8px)!important;min-height:140px!important;padding:6px!important}.wbin b{font-size:17px!important;overflow-wrap:anywhere;line-height:1.2}
 .wit{font-size:48px!important;padding:4px 6px 2px!important}.wdone{font-size:34px!important}.wq{font-size:21px!important}
}
@media (max-width:360px){.ncat .nn{font-size:15px}.menu .tile.nt .t{font-size:14px!important}.ncat .ne,.tile.nt .e{width:58px;height:58px;font-size:33px!important}}
/* ===== компактные игровые экраны (внутри приложения) ===== */
html.emb .wrap{padding:6px 8px calc(6px + env(safe-area-inset-bottom))!important}
html.emb main,html.emb .panel{padding:2px!important;border-radius:0!important}
html.emb h2{margin:2px 0 8px!important;font-size:clamp(19px,3.2dvh,26px)!important;line-height:1.2}
html.emb .say{font-size:clamp(16px,2.6dvh,22px)!important;margin:2px 0 8px!important}
html.emb .stars{min-height:0!important;margin-top:6px!important;font-size:clamp(20px,3dvh,32px)!important}
html.emb .navrow{margin-top:10px!important}
html.emb .navrow button[onclick=&quot;home()&quot;]{display:none!important}
html.emb .navrow:not(:has(button:not([onclick=&quot;home()&quot;]))){display:none!important}
html.emb .ask,html.emb .wq{font-size:clamp(19px,3.1dvh,30px)!important;margin-bottom:8px!important;gap:10px!important}
html.emb .ask button,html.emb .wq .speaker,html.emb .speaker{width:clamp(48px,7dvh,72px)!important;height:clamp(48px,7dvh,72px)!important;font-size:clamp(24px,3.4dvh,36px)!important}
html.emb .row{margin-bottom:10px!important;gap:12px!important}
/* крупные картинки и кнопки — от высоты экрана */
html.emb .opt{min-width:clamp(96px,min(26vw,16dvh),220px)!important;min-height:clamp(96px,min(26vw,16dvh),220px)!important;font-size:clamp(60px,min(17vw,11dvh),140px)!important}
html.emb .opts{gap:clamp(8px,1.6dvh,18px)!important}
html.emb .ch{height:clamp(84px,14dvh,230px)!important;font-size:clamp(56px,min(18vw,10dvh),160px)!important}
html.emb .picbig,html.emb .reveal{font-size:clamp(84px,15dvh,190px)!important}
html.emb .wshow{font-size:clamp(70px,12dvh,140px)!important;margin-bottom:8px!important}
html.emb .wo{min-height:clamp(84px,13dvh,170px)!important}
html.emb .wo .we,html.emb .we{font-size:clamp(48px,8dvh,96px)!important}
html.emb .ke{font-size:clamp(54px,9dvh,110px)!important}.kshow{font-size:clamp(56px,10dvh,120px)!important}
html.emb .readword,html.emb .enw{font-size:clamp(44px,9dvh,110px)!important;margin:4px 0!important}
html.emb .huge{font-size:clamp(110px,22dvh,260px)!important}
html.emb .wbtn{font-size:clamp(36px,7.5dvh,90px)!important;padding:4px 16px 8px!important}

/* ===== ДИЗАЙН-СИСТЕМА «Учимся играя» ===== */
:root{
 --ds-bg:#FFF8EC;--ds-card:#FFFFFF;--ds-ink:#292944;--ds-muted:#8B8AA3;--ds-line:#F0E8DA;
 --ds-coral:#FF8A65;--ds-blue:#5187F5;--ds-green:#43BD79;--ds-violet:#9874F5;--ds-yellow:#F6A321;--ds-teal:#20B4C2;
 --ds-r-sm:16px;--ds-r:24px;--ds-r-lg:30px;
 --ds-sh:0 2px 0 rgba(41,41,68,.04),0 8px 22px rgba(41,41,68,.08);--ds-sh-press:0 1px 0 rgba(41,41,68,.04),0 3px 10px rgba(41,41,68,.08);
 --ds-pad:14px;--ds-tap:48px;--ds-fast:.16s;--ds-ease:cubic-bezier(.2,.8,.3,1);
}
/* ===== навигация и единый стиль разделов ===== */
:root{--bg:var(--ds-bg);--ink:var(--ds-ink);--muted:var(--ds-muted)}
html.emb body{background:var(--ds-bg)!important;background-image:none!important;color:var(--ds-ink)}
html.emb header{display:none!important}
html.emb .credit,html.emb p.voice[style*=&quot;font-weight:700&quot;]{display:none!important}
html.emb .note,html.emb p.voice{font-size:12px!important;margin:8px 0 0!important}
html.emb .wrap{padding-top:10px}
html.emb main,html.emb .panel{min-height:auto;background:transparent!important;box-shadow:none!important;padding:4px!important}
html,body{overflow-x:clip;max-width:100%}
/* категории */
.ncats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.ncat{position:relative;border:none;border-radius:var(--ds-r);background:var(--ds-card);color:var(--ds-ink);font:inherit;cursor:pointer;padding:16px 12px 14px;
 display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:var(--ds-sh);min-height:168px;justify-content:flex-start;
 transition:transform var(--ds-fast) var(--ds-ease),box-shadow var(--ds-fast)}
.ncat:active,.tile.nt:active{transform:scale(.96);box-shadow:var(--ds-sh-press)}
.ncat .ne,.tile.nt .e{width:76px;height:76px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:44px!important;line-height:1;
 background:color-mix(in srgb,var(--c,#9874F5) 18%,#fff);box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--c,#9874F5) 22%,transparent)}
.ncat .nn{font-size:18px;margin-top:10px;line-height:1.2}
.ncat .nc{font-size:13px;color:var(--ds-muted);margin-top:6px;font-weight:700}
.ncat .np,.tile.nt .np{width:72%;height:7px;border-radius:99px;background:#F1ECF8;margin-top:8px;overflow:hidden}
.ncat .np i,.tile.nt .np i{display:block;height:100%;border-radius:99px;background:var(--c,#9874F5)}
h2.nh{text-align:center;font-size:26px;margin:4px 0 14px;color:var(--ds-ink)}
/* карточки игр */
.menu .tile.nt{background:var(--ds-card)!important;background-image:none!important;color:var(--ds-ink)!important;box-shadow:var(--ds-sh)!important;border-radius:var(--ds-r)!important;
 padding:14px 8px 12px!important;display:flex;flex-direction:column;align-items:center;position:relative;transition:transform var(--ds-fast) var(--ds-ease),box-shadow var(--ds-fast)}
.menu .tile.nt .t{color:var(--ds-ink)!important;font-size:16px!important;line-height:1.2;margin-top:10px!important}
.menu .tile.nt .done{position:absolute;top:8px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--ds-green);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center}
.menu{gap:14px!important}
/* появление */
@keyframes dsIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ncat,.menu .tile.nt{animation:dsIn .32s var(--ds-ease) both}
.ncat:nth-child(2),.menu .tile:nth-child(2){animation-delay:.03s}.ncat:nth-child(3),.menu .tile:nth-child(3){animation-delay:.06s}.ncat:nth-child(4),.menu .tile:nth-child(4){animation-delay:.09s}
.ncat:nth-child(5),.menu .tile:nth-child(5){animation-delay:.12s}.ncat:nth-child(n+6),.menu .tile:nth-child(n+6){animation-delay:.15s}
/* кнопки и ответы — общий вид */
.big-btn{border-radius:var(--ds-r-sm)!important}
.opt,.wo,.ch,.wbtn,.card,.pic,.clap,.box,.mc,.dot,.kcell,.wcard{transition:transform var(--ds-fast) var(--ds-ease)}
.opt:active,.wo:active,.ch:active,.wbtn:active,.card:active,.pic:active,.clap:active{transform:scale(.95)}
.opt,.wo,.ch,.wbtn,.card,.pic,.clap{border-radius:var(--ds-r)!important}
.opt.ok,.wo.ok,.ch.ok,.wbtn.ok{animation:dsPop .4s var(--ds-ease)}
@keyframes dsPop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
button:focus-visible{outline:4px solid color-mix(in srgb,var(--ds-blue) 60%,#fff);outline-offset:3px}

let bySyl=true;try{bySyl=localStorage.getItem(&#x27;az_syl&#x27;)!==&#x27;0&#x27;;}catch(e){}

  return [...w].map(ch=&gt;ch===&#x27;-&#x27;?(syl?&#x27;&lt;span class=&quot;hy&quot;&gt;-&lt;/span&gt;&#x27;:&#x27;&#x27;):`&lt;span class=&quot;${VOWS.includes(ch.toLowerCase())?&#x27;vw&#x27;:/[ьъ]/i.test(ch)?&#x27;sg&#x27;:&#x27;cs&#x27;}&quot;&gt;${ch}&lt;/span&gt;`).join(&#x27;&#x27;);
}

function bindToggle(redraw){const b=document.getElementById(&#x27;syl&#x27;);if(b)b.onclick=()=&gt;{bySyl=!bySyl;try{localStorage.setItem(&#x27;az_syl&#x27;,bySyl?&#x27;1&#x27;:&#x27;0&#x27;)}catch(e){}redraw();};}

/* ===== 7. Найди слово по картинке ===== */
let pw={n:0,ok:0,cur:null};
function picWord(){clearT();pw={n:0,ok:0,cur:null};pwQ();}
function pwQ(){
  if(pw.n&gt;=8) return finish(pw.ok,8,picWord);
  const t=rnd(SHORT);const len=plain(t[1]).length;
  const near=shuffle(SHORT.filter(x=&gt;x!==t&amp;&amp;Math.abs(plain(x[1]).length-len)&lt;=1));
  const opts=shuffle([t,...near.slice(0,2)]);
  pw.cur={t,opts,tries:0,done:false};pwDraw();
  speak(&quot;Найди, как называется картинка&quot;);
}
function pwDraw(){
  const {t,opts}=pw.cur;
  app.innerHTML=`&lt;div class=&quot;row&quot;&gt;&lt;h2 style=&quot;margin:0&quot;&gt;Прочитай и найди слово&lt;/h2&gt;${sylToggle()}&lt;/div&gt;
   &lt;div class=&quot;picbig&quot; id=&quot;pic&quot;&gt;${t[0]}&lt;/div&gt;
   &lt;div class=&quot;wopts&quot;&gt;${opts.map((o,i)=&gt;`&lt;button class=&quot;wbtn&quot; data-i=&quot;${i}&quot;&gt;${colorWord(o[1],bySyl)}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;
   &lt;div class=&quot;stars&quot;&gt;${&quot;⭐&quot;.repeat(pw.ok)}&lt;/div&gt;
   &lt;div class=&quot;navrow&quot;&gt;${back()}&lt;button class=&quot;big-btn y&quot; id=&quot;hint&quot;&gt;💡 Подсказка&lt;/button&gt;&lt;/div&gt;`;
  bindToggle(pwDraw);
  document.getElementById(&#x27;hint&#x27;).onclick=()=&gt;{pw.cur.tries++;sayS(t[1]);};
  app.querySelectorAll(&#x27;.wbtn&#x27;).forEach(b=&gt;b.onclick=()=&gt;{
    if(pw.cur.done)return;const o=opts[+b.dataset.i];
    if(o===t){pw.cur.done=true;b.classList.add(&#x27;ok&#x27;);if(!pw.cur.tries){pw.ok++;star();}tone(&#x27;ok&#x27;);speak(praise()+&quot; &quot;+plain(t[1]));pw.n++;timers.push(setTimeout(pwQ,1800));}
    else{pw.cur.tries++;b.classList.add(&#x27;no&#x27;,&#x27;shake&#x27;);tone(&#x27;bad&#x27;);speak(&quot;Здесь написано: &quot;+plain(o[1])+&quot;. Ищи ещё!&quot;);}
  });
}

  app.innerHTML=`&lt;h2&gt;Читаем слова. Выбери букву!&lt;/h2&gt;
   &lt;div class=&quot;lpick&quot;&gt;${L.map(x=&gt;`&lt;button class=&quot;lt ${x[1]}&quot; onclick=&quot;readLetter(&#x27;${x[0]}&#x27;,0)&quot;&gt;${x[0]}${learned[&#x27;r&#x27;+x[0]]?&#x27;&lt;span class=&quot;done&quot;&gt;⭐&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;
   &lt;div class=&quot;navrow&quot;&gt;${back()}&lt;/div&gt;`;

       &lt;div class=&quot;dots&quot;&gt;${list.map((_,j)=&gt;j&lt;i?&#x27;🟢&#x27;:j===i?&#x27;🟡&#x27;:&#x27;⚪&#x27;).join(&#x27; &#x27;)}&lt;/div&gt;

    else{
      document.getElementById(&#x27;again&#x27;).onclick=()=&gt;{sayS(w);timers.push(setTimeout(()=&gt;sayW(w),1600));};
      document.getElementById(&#x27;nx&#x27;).onclick=()=&gt;{
        if(i&lt;list.length-1) readLetter(ch,i+1);

            &lt;div class=&quot;row&quot;&gt;${idx&lt;L.length-1?`&lt;button class=&quot;big-btn g&quot; onclick=&quot;readLetter(&#x27;${L[idx+1][0]}&#x27;,0)&quot;&gt;Буква ${L[idx+1][0]} ▶&lt;/button&gt;`:&#x27;&#x27;}&lt;button class=&quot;big-btn y&quot; onclick=&quot;readMenu()&quot;&gt;🔤 Буквы&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;}

/* ===== 9. Скажи слово (микрофон) ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let sg={n:0,ok:0,mode:SR?&#x27;rec&#x27;:&#x27;self&#x27;};
const norm=t=&gt;t.toLowerCase().replace(/ё/g,&#x27;е&#x27;).replace(/[^а-я\s]/g,&#x27; &#x27;).replace(/\s+/g,&#x27; &#x27;).trim();
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=&gt;[i]);for(let j=1;j&lt;=b.length;j++)d[0][j]=j;
  for(let i=1;i&lt;=a.length;i++)for(let j=1;j&lt;=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length];}
function matches(heard,target){const t=norm(target);
  return heard.some(h=&gt;{const words=norm(h).split(&#x27; &#x27;);if(norm(h).replace(/ /g,&#x27;&#x27;)===t)return true;
    return words.some(w=&gt;w===t||(t.length&gt;=4&amp;&amp;lev(w,t)&lt;=1)||(t.length&gt;=6&amp;&amp;lev(w,t)&lt;=2));});}
function sayGame(){clearT();sg={n:0,ok:0,mode:SR?&#x27;rec&#x27;:&#x27;self&#x27;};sgQ();}
function sgQ(){
  if(sg.n&gt;=8) return finish(sg.ok,8,sayGame);
  const t=rnd(SHORT);const w=t[1];let shown=false,busy=false,recog=null,mrec=null,chunks=[],audioURL=null;
  const draw=(msg=&#x27;&#x27;)=&gt;{
    app.innerHTML=`&lt;div class=&quot;row&quot;&gt;&lt;h2 style=&quot;margin:0&quot;&gt;Прочитай слово вслух!&lt;/h2&gt;${sylToggle()}&lt;/div&gt;
     &lt;div class=&quot;readcard&quot;&gt;&lt;div class=&quot;readword&quot;&gt;${colorWord(w,bySyl)}&lt;/div&gt;
      &lt;div class=&quot;reveal ${shown?&#x27;&#x27;:&#x27;hid&#x27;}&quot; style=&quot;font-size:clamp(90px,14vw,140px)&quot;&gt;${t[0]}&lt;/div&gt;
      &lt;div class=&quot;row&quot;&gt;&lt;button class=&quot;mic&quot; id=&quot;mic&quot;&gt;🎤&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;heard&quot; id=&quot;heard&quot;&gt;${msg||(sg.mode===&#x27;rec&#x27;?&#x27;Нажми на микрофон и скажи слово&#x27;:&#x27;Нажми 🎤, скажи слово, потом нажми ещё раз&#x27;)}&lt;/div&gt;
      &lt;div class=&quot;row&quot; id=&quot;selfbtns&quot;&gt;&lt;/div&gt;&lt;/div&gt;
     &lt;div class=&quot;stars&quot;&gt;${&quot;⭐&quot;.repeat(sg.ok)}&lt;/div&gt;
     &lt;div class=&quot;navrow&quot;&gt;${back()}&lt;button class=&quot;big-btn y&quot; id=&quot;skip&quot;&gt;Другое слово ▶&lt;/button&gt;&lt;/div&gt;`;
    bindToggle(()=&gt;draw(document.getElementById(&#x27;heard&#x27;).innerHTML));
    document.getElementById(&#x27;skip&#x27;).onclick=()=&gt;{stopAll();sg.n++;sgQ();};
    document.getElementById(&#x27;mic&#x27;).onclick=sg.mode===&#x27;rec&#x27;?listen:recordSelf;
  };
  const win=()=&gt;{shown=true;sg.ok++;sg.n++;star();tone(&#x27;win&#x27;);confetti();speak(praise()+&quot; &quot;+plain(w));draw(`✅ &lt;b&gt;${praise()}&lt;/b&gt;`);
    document.getElementById(&#x27;mic&#x27;).onclick=null;timers.push(setTimeout(sgQ,2600));};
  const stopAll=()=&gt;{try{recog&amp;&amp;recog.abort()}catch(e){}try{mrec&amp;&amp;mrec.state===&#x27;recording&#x27;&amp;&amp;mrec.stop()}catch(e){}};
  function listen(){
    if(busy)return;busy=true;try{speechSynthesis.cancel()}catch(e){}
    recog=new SR();recog.lang=&#x27;ru-RU&#x27;;recog.interimResults=false;recog.maxAlternatives=5;
    const mic=document.getElementById(&#x27;mic&#x27;);mic.classList.add(&#x27;rec&#x27;);document.getElementById(&#x27;heard&#x27;).textContent=&#x27;Слушаю… говори!&#x27;;
    let got=false;
    recog.onresult=e=&gt;{got=true;const alts=[];for(const r of e.results)for(let i=0;i&lt;r.length;i++)alts.push(r[i].transcript);
      if(matches(alts,plain(w)))win();
      else{tone(&#x27;bad&#x27;);document.getElementById(&#x27;heard&#x27;).innerHTML=`Я услышала: &lt;b&gt;${alts[0]||&#x27;…&#x27;}&lt;/b&gt;. Попробуй ещё раз!`;}};
    recog.onerror=e=&gt;{busy=false;mic.classList.remove(&#x27;rec&#x27;);
      if(e.error===&#x27;network&#x27;||e.error===&#x27;service-not-allowed&#x27;||e.error===&#x27;language-not-supported&#x27;){sg.mode=&#x27;self&#x27;;draw(&#x27;Без интернета я не могу распознать слово. Давай запишем голос и послушаем!&#x27;);}
      else if(e.error===&#x27;not-allowed&#x27;){draw(&#x27;Разреши доступ к микрофону в браузере 🎤&#x27;);}
      else document.getElementById(&#x27;heard&#x27;).textContent=&#x27;Не расслышала. Нажми и скажи погромче!&#x27;;};
    recog.onend=()=&gt;{busy=false;const m=document.getElementById(&#x27;mic&#x27;);m&amp;&amp;m.classList.remove(&#x27;rec&#x27;);if(!got&amp;&amp;!shown){const h=document.getElementById(&#x27;heard&#x27;);if(h&amp;&amp;h.textContent===&#x27;Слушаю… говори!&#x27;)h.textContent=&#x27;Не расслышала. Нажми и скажи погромче!&#x27;;}};
    try{recog.start();}catch(e){busy=false;sg.mode=&#x27;self&#x27;;draw();return;}
    timers.push(setTimeout(()=&gt;{if(busy&amp;&amp;!got){try{recog.abort()}catch(e){}busy=false;const m=document.getElementById(&#x27;mic&#x27;);m&amp;&amp;m.classList.remove(&#x27;rec&#x27;);
      const h=document.getElementById(&#x27;heard&#x27;);if(h)h.innerHTML=&#x27;Не получилось услышать. Нажми 🎤 ещё раз или запиши голос.&#x27;;
      const sb=document.getElementById(&#x27;selfbtns&#x27;);if(sb&amp;&amp;!sb.innerHTML)sb.innerHTML=&#x27;&lt;button class=&quot;big-btn&quot; id=&quot;toself&quot;&gt;🎙️ Записать и послушать&lt;/button&gt;&#x27;;
      const ts=document.getElementById(&#x27;toself&#x27;);if(ts)ts.onclick=()=&gt;{sg.mode=&#x27;self&#x27;;draw();};}},8000));
  }
  async function recordSelf(){
    const mic=document.getElementById(&#x27;mic&#x27;);
    if(mrec&amp;&amp;mrec.state===&#x27;recording&#x27;){mrec.stop();return;}
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mrec=new MediaRecorder(stream);chunks=[];
      mrec.ondataavailable=e=&gt;chunks.push(e.data);
      mrec.onstop=()=&gt;{stream.getTracks().forEach(t=&gt;t.stop());mic.classList.remove(&#x27;rec&#x27;);
        if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:mrec.mimeType||&#x27;audio/webm&#x27;}));
        new Audio(audioURL).play().catch(()=&gt;{});
        document.getElementById(&#x27;heard&#x27;).innerHTML=&#x27;Послушай себя! Правильно получилось?&#x27;;
        document.getElementById(&#x27;selfbtns&#x27;).innerHTML=`&lt;button class=&quot;big-btn&quot; id=&quot;play&quot;&gt;🔁 Послушать&lt;/button&gt;&lt;button class=&quot;big-btn&quot; id=&quot;model&quot;&gt;🔊 Как надо&lt;/button&gt;&lt;button class=&quot;big-btn g&quot; id=&quot;yes&quot;&gt;👍 Да!&lt;/button&gt;`;
        document.getElementById(&#x27;play&#x27;).onclick=()=&gt;new Audio(audioURL).play().catch(()=&gt;{});
        document.getElementById(&#x27;model&#x27;).onclick=()=&gt;sayW(w);
        document.getElementById(&#x27;yes&#x27;).onclick=win;};
      mrec.start();mic.classList.add(&#x27;rec&#x27;);document.getElementById(&#x27;heard&#x27;).textContent=&#x27;Говори! Потом нажми на микрофон ещё раз&#x27;;
      timers.push(setTimeout(()=&gt;{if(mrec&amp;&amp;mrec.state===&#x27;recording&#x27;)mrec.stop();},5000));
    }catch(e){document.getElementById(&#x27;heard&#x27;).textContent=&#x27;Микрофон недоступен. Разреши доступ к микрофону в браузере.&#x27;;}
  }
  draw();
}


/* ===== 10. Собери слово ===== */
let bw={n:0,ok:0};
function buildWord(){clearT();bw={n:0,ok:0};bwQ();}

let secTime=0,extra=0;

setInterval(()=>{if(!cur||document.hidden||!['a02','a24'].includes(curId)||document.getElementById('rest').style.display==='flex')return;secTime++;const lim=curLimit();if(lim&&secTime>=lim*60+extra)showRest();},1000);
function showRest(){const kz=kzOn();const young=curId==='a02';const pool=ACTS.filter(x=>young?x.a[0]<24:x.a[1]>24);const x=pool[Math.floor(Math.random()*pool.length)];
 try{cur.contentWindow.speechSynthesis.cancel();cur.contentWindow.reset&&cur.contentWindow.reset();}catch(e){}

 document.getElementById('rA').innerHTML=`<b>${ADIR[x.d][0]} ${x.t}</b><br>${x.s}${x.w?'<br>⚠️ '+x.w:''}`;
 document.getElementById('rGo').textContent=kz?'Жарайды, ойнаймыз!':'Хорошо, играем вместе!';document.getElementById('rMore').textContent=kz?'Тағы 5 минут':'Ещё 5 минут';
 document.getElementById('rest').style.display='flex';}
document.getElementById('rGo').onclick=()=>{document.getElementById('rest').style.display='none';secTime=0;extra=0;closeSec();};
document.getElementById('rMore').onclick=()=>{document.getElementById('rest').style.display='none';extra+=300;};
